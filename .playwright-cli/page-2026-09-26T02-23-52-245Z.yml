      - paragraph [ref=e28]:
        - text: Hongyu Hè
        - code [ref=e29]: \ˈho:nˌu hə\
        - text: is a second-year PhD student in Electrical Engineering at Princeton, advised by
        - link "Prof. Maria Apostolaki" [ref=e30] [cursor=pointer]:
          - /url: https://netsyn.princeton.edu/people/maria-apostolaki
        - text: . At Princeton, He is a
        - link "NAM" [ref=e31] [cursor=pointer]:
          - /url: https://nam.ai.princeton.edu/
        - text: Fellow’25 in AI and
        - link "UAF" [ref=e32] [cursor=pointer]:
          - /url: https://gradfutures.princeton.edu/gain-experience/university-administrative-fellowships
        - text: Fellow’24 in CS. His research sits at the intersection of computer networking, formal logic, and machine learning. Hongyu earned his MSc in CS from ETH Zürich as one of six
        - link "Direct Doctoral Scholars" [ref=e33] [cursor=pointer]:
          - /url: https://inf.ethz.ch/doctorate/direct-doctorate-computer-science.html
        - text: in 2024. At ETH, he worked with
        - link "Prof. Gustavo Alonso" [ref=e34] [cursor=pointer]:
          - /url: https://people.inf.ethz.ch/alonso/
        - text: in the
        - link "Systems Group" [ref=e35] [cursor=pointer]:
          - /url: https://systems.ethz.ch/
        - text: on FPGA research and was an associated researcher at the
        - link "AI Center" [ref=e36] [cursor=pointer]:
          - /url: https://ai.ethz.ch/
        - text: . Hongyu previously studied Math and CS in Amsterdam, where he was led into research by
        - link "Prof. Andy Tanenbaum" [ref=e37] [cursor=pointer]:
          - /url: https://en.wikipedia.org/wiki/Andrew_S._Tanenbaum
        - text: and graduated with the
        - link "ADS Thesis Award" [ref=e38] [cursor=pointer]:
          - /url: https://abs.uva.nl/content/news/2021/07/the-2021-ads-thesis-awards-are-now-open-for-nominations.html
        - text: . In 2019, he received the
        - link "Young Talent Award" [ref=e39] [cursor=pointer]:
          - /url: https://khmw.nl/khmw-jong-talent-prijzen-khmw-young-talent-awards/
        - text: from the
        - link "Royal Holland Society" [ref=e40] [cursor=pointer]:
          - /url: https://khmw.nl/over_ons/
        - text: for achieving the highest GPA. Originally, Hongyu attended
        - link "law school" [ref=e41] [cursor=pointer]:
          - /url: https://law.tju.edu.cn/English.htm
        - text: in China before turning to science and engineering.
